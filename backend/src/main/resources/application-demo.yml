server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: true
  tomcat:
    threads:
      max: 30
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 15000
      max-lifetime: 300000
  session:
    jdbc:
      cleanup-cron: '0 */5 * * * *'
