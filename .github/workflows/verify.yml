name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reconcilex
          POSTGRES_USER: reconcilex
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcilex -d reconcilex"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit, H2 and PostgreSQL integration tests
        working-directory: backend
        env:
          RECONCILEX_POSTGRES_TEST: 'true'
          DB_URL: jdbc:postgresql://localhost:5432/reconcilex
          DB_USER: reconcilex
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        run: ./mvnw --batch-mode test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend contract tests
        run: node --test backend/src/test/frontend/*.test.cjs
